<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Monitor Cripto">
<title>Monitor Cripto</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0); }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0e1116; color: #d6dbe3;
  font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; }
button, select, input { font-family: inherit; font-size: 15px; color: #d6dbe3; background: #1f2630;
  border: 1px solid #323c4a; border-radius: 6px; height: 36px; padding: 0 10px; vertical-align: middle;
  -webkit-appearance: none; outline: none; }
button:active { background: #2c3644; }
select { padding-right: 24px; }

#bar { position: absolute; top: 0; left: 0; right: 0; height: 52px; padding: 8px; background: #161b22;
  border-bottom: 1px solid #262d38; white-space: nowrap; overflow: hidden; }
#bar > * { margin-right: 6px; }
#btnCoins { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
#status { float: right; margin: 0; line-height: 36px; font-size: 13px; color: #8b95a5; }
#status i { display: inline-block; width: 9px; height: 9px; border-radius: 5px; background: #8b95a5; margin-right: 6px; }
#status.live i { background: #22c55e; } #status.poll i { background: #eab308; } #status.off i { background: #ef4444; }

#grid { position: absolute; top: 52px; left: 0; right: 0; bottom: 0; }
#empty { position: absolute; top: 40%; left: 0; right: 0; text-align: center; color: #6b7686; font-size: 16px; padding: 0 20px; }

.panel { position: absolute; border: 1px solid #262d38; background: #0e1116; overflow: hidden; }
.panel.hit-alvo { border: 2px solid #22c55e; -webkit-animation: blinkG 1s infinite; animation: blinkG 1s infinite; }
.panel.hit-stop { border: 2px solid #ef4444; -webkit-animation: blinkR 1s infinite; animation: blinkR 1s infinite; }
@-webkit-keyframes blinkG { 50% { border-color: #0e1116; } } @keyframes blinkG { 50% { border-color: #0e1116; } }
@-webkit-keyframes blinkR { 50% { border-color: #0e1116; } } @keyframes blinkR { 50% { border-color: #0e1116; } }

.head { position: relative; height: 34px; line-height: 34px; padding: 0 84px 0 10px; white-space: nowrap; overflow: hidden; border-bottom: 1px solid #1c222b; }
.head .sym { font-size: 16px; margin-right: 8px; }
.head .px { font-size: 16px; margin-right: 8px; font-weight: 600; }
.head .chg { font-size: 13px; margin-right: 8px; }
.up { color: #26a69a; } .dn { color: #ef5350; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-right: 8px; }
.badge:empty { display: none; }
.sg { font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-right: 8px; background: #2563eb; color: #fff; cursor: pointer; }
.sg.t1 { background: #15803d; }
.sg:empty { display: none; }
.panel.sig-new { border: 2px solid #3b82f6; -webkit-animation: blinkB 1s infinite; animation: blinkB 1s infinite; }
@-webkit-keyframes blinkB { 50% { border-color: #0e1116; } } @keyframes blinkB { 50% { border-color: #0e1116; } }
.badge.alvo { background: #22c55e; color: #04130a; } .badge.stop { background: #ef4444; color: #fff; }
.head .x { position: absolute; right: 6px; top: 0; height: 28px; margin-top: 3px; padding: 0 10px; font-size: 14px; background: #0e1116; border-color: #2a3240; z-index: 2; box-shadow: -8px 0 6px #0e1116; }

.lv { height: 40px; padding: 4px 6px; white-space: nowrap; overflow: hidden; border-bottom: 1px solid #1c222b; }
.lv input { width: 24%; height: 31px; font-size: 14px; padding: 0 6px; margin-right: 1%; }
.lv input.e { border-color: #3b82f6; } .lv input.a { border-color: #22c55e; } .lv input.s { border-color: #ef4444; }
.lv .rr { display: inline-block; vertical-align: middle; font-size: 11px; line-height: 14px; color: #8b95a5; white-space: nowrap; }
.lv .rr .et { color: #60a5fa; }
.tr { font-size: 12px; font-weight: 700; margin-right: 8px; }
.tr.alta { color: #22c55e; } .tr.baixa { color: #ef4444; } .tr.neutro { color: #8b95a5; }
.head .chg b { font-weight: 400; color: #6b7686; }
.panel canvas { display: block; }
.panel.hide { display: none; }
.head .big { position: absolute; right: 44px; top: 0; height: 28px; margin-top: 3px; padding: 0 9px; font-size: 14px; background: #0e1116; border-color: #2a3240; z-index: 2; box-shadow: -8px 0 6px #0e1116; }
.zb { display: none; position: absolute; right: 84px; bottom: 30px; z-index: 3; }
.panel.big .zb { display: block; }
.zb button { width: 44px; height: 40px; padding: 0; margin-left: 6px; font-size: 20px; background: rgba(31,38,48,0.85); }
.lv .rr .pl { font-weight: 700; font-size: 12px; }

#picker { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #0e1116; z-index: 10; }
#pickTop { position: absolute; top: 0; left: 0; right: 0; height: 100px; padding: 8px; background: #161b22; border-bottom: 1px solid #262d38; }
#pickTop .row1, #pickTop .row2 { height: 42px; white-space: nowrap; }
#search { width: 60%; margin-right: 6px; }
#btnDone { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; float: right; }
.tog.on { background: #334155; border-color: #64748b; color: #fff; }
#count { margin-left: 8px; color: #8b95a5; }
#list { position: absolute; top: 100px; left: 0; right: 0; bottom: 0; overflow-y: scroll; -webkit-overflow-scrolling: touch; }
.it { height: 46px; line-height: 46px; padding: 0 14px; border-bottom: 1px solid #1a2029; white-space: nowrap; overflow: hidden; }
.it.sel { background: #13233d; }
.it .n { display: inline-block; width: 34px; color: #5b6575; font-size: 12px; }
.it .s { display: inline-block; width: 30%; font-weight: 600; font-size: 15px; }
.it .p { display: inline-block; width: 30%; }
.it .c { display: inline-block; width: 18%; }
.it .ck { float: right; color: #3b82f6; font-size: 18px; font-weight: 700; }
#listMsg { padding: 30px; text-align: center; color: #6b7686; }

#btnRadar.hot { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
#toasts { position: absolute; left: 10px; bottom: 28px; width: 300px; z-index: 30; }
.toast { position: relative; margin-top: 8px; padding: 10px 12px 10px 12px; background: #13233d; border: 1px solid #2563eb; border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5); -webkit-animation: tin 0.3s; animation: tin 0.3s; }
@-webkit-keyframes tin { from { opacity: 0; -webkit-transform: translateY(10px); } to { opacity: 1; -webkit-transform: none; } }
@keyframes tin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.toast .tt { font-size: 15px; color: #fff; padding-right: 30px; }
.toast .td { font-size: 12px; color: #93a3b8; margin: 3px 0 8px; }
.toast .op { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; height: 32px; }
.toast .cl { position: absolute; top: 6px; right: 6px; height: 28px; padding: 0 9px; background: transparent; }

#radarBox { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #0e1116; z-index: 12; }
#rdTop { position: absolute; top: 0; left: 0; right: 0; padding: 8px; background: #161b22; border-bottom: 1px solid #262d38; }
#rdTop .row1 { height: 42px; white-space: nowrap; }
#rdTop .row1 b { font-size: 17px; margin: 0 10px 0 4px; vertical-align: middle; }
#rdClose { float: right; background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
#rdInfo { font-size: 12px; color: #8b95a5; line-height: 16px; padding: 2px 4px 0; }
#rdList { position: absolute; top: 84px; left: 0; right: 0; bottom: 0; overflow-y: scroll; -webkit-overflow-scrolling: touch; }
.ra { padding: 8px 14px; border-bottom: 1px solid #1a2029; white-space: nowrap; overflow: hidden; }
.ra b { display: inline-block; width: 70px; font-size: 16px; vertical-align: middle; }
.ra .sc { display: inline-block; width: 40px; text-align: center; background: #2563eb; color: #fff; font-weight: 700; border-radius: 4px; font-size: 13px; padding: 2px 0; margin-right: 12px; vertical-align: middle; }
.ra .rd { display: inline-block; font-size: 12px; color: #8b95a5; line-height: 16px; vertical-align: middle; }
.ra button { float: right; margin-top: 2px; }
.ra .st { float: right; margin: 8px 12px 0 0; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: #1f2630; color: #8b95a5; }
.ra .st.win { background: #14532d; color: #4ade80; } .ra .st.loss { background: #450a0a; color: #f87171; }
#rdScore { font-size: 13px; font-weight: 600; padding: 3px 4px 0; }
#rdList { top: 104px; }
</style>
</head>
<body>

<div id="bar">
  <button id="btnCoins">Moedas</button>
  <select id="selInt">
    <option value="1m">1m</option><option value="3m">3m</option><option value="5m">5m</option>
    <option value="15m">15m</option><option value="30m">30m</option><option value="1h">1h</option>
    <option value="4h">4h</option><option value="1d">1d</option>
  </select>
  <button id="btnRadar">Radar</button>
  <button id="btnInd">Indic: on</button>
  <button id="btnSig">Sinais: on</button>
  <button id="btnSound">Som: off</button>
  <button id="btnLink">Link</button>
  <p id="status"><i></i><span>parado</span></p>
</div>

<div id="grid"><div id="empty">Toque em <b>Moedas</b> e escolha até 4 para acompanhar.<br><small>Toque duas vezes num gráfico para ampliar.</small></div></div>

<div id="picker">
  <div id="pickTop">
    <div class="row1">
      <input id="search" type="text" placeholder="Buscar (ex: SOL)" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
      <button id="btnDone">Pronto</button>
    </div>
    <div class="row2">
      <button class="tog on" id="togTop">Top 100</button>
      <button class="tog" id="togAll">Todas (USDT)</button>
      <span id="count">0/4</span>
    </div>
  </div>
  <div id="list"><div id="listMsg">Carregando lista da Binance...</div></div>
</div>

<div id="radarBox">
  <div id="rdTop">
    <div class="row1">
      <b>Radar de sinais</b>
      <button class="tog on" id="rdTog">Radar: on</button>
      <button id="rdTf">Só este tempo</button>
      <button id="rdClear">Limpar</button>
      <button id="rdClose">Fechar</button>
    </div>
    <div id="rdInfo"></div>
    <div id="rdScore"></div>
  </div>
  <div id="rdList"></div>
</div>

<div id="toasts"></div>

<script>
(function () {
  'use strict';

  var API_HOSTS = ['https://api.binance.com', 'https://data-api.binance.vision'];
  var WS_HOSTS = ['wss://stream.binance.com:9443', 'wss://data-stream.binance.vision'];
  var MAX_CHARTS = 4;
  var LIMIT = 300;  // candles guardados (para dar margem ao zoom)
  var expanded = null; // moeda ampliada em tela cheia
  var POLL_MS = 5000;
  // Moedas estáveis/fiat que não fazem sentido no gráfico contra USDT
  var SKIP = { USDC: 1, FDUSD: 1, TUSD: 1, BUSD: 1, DAI: 1, USDP: 1, EUR: 1, AEUR: 1, EURI: 1, USD1: 1, XUSD: 1, BFUSD: 1, USDE: 1, PYUSD: 1, RLUSD: 1, GBP: 1, TRY: 1, BRL: 1 };

  var apiIdx = 0, wsIdx = 0;
  var state = { selected: [], interval: '15m', levels: {}, mode: 'top', sound: false, ind: true, sig: true, radar: true };
  var radar = { list: [], listT: 0, alerts: [], seen: {}, gen: 0, scanning: false, prog: 0, total: 0, timer: null, htf: {}, unseen: 0, lastScan: 0, next: 0 };
  var h1 = {};  // preço de 1h atrás, por moeda
  var IV_MS = { '1m': 6e4, '3m': 18e4, '5m': 3e5, '15m': 9e5, '30m': 18e5, '1h': 36e5, '4h': 144e5, '1d': 864e5, '1w': 6048e5 };

  // ---------- regras do score (padrão; regras.json, se existir, substitui) ----------
  var RULES = {
    score_forte: 70, score_fraco: 55,
    peso_tendencia: 20, peso_tendencia_maior: 20, peso_ema50: 10, peso_rsi: 15, peso_volume: 15, peso_estrutura: 15, peso_candle: 5,
    rsi_min: 50, rsi_max: 70, rsi_bloqueio: 75, volume_mult: 1.5, rompimento_candles: 15, pullback_tolerancia_pct: 0.2,
    lateral_candles: 20, lateral_max_cruzamentos: 3, atr_periodo: 14, atr_min_pct: 0.15, esticado_max_atr: 2.5,
    subida_candles: 30, subida_max_atr: 6, pausa_apos_stop_candles: 10,
    stop_candles: 5, stop_atr: 2, risco_max_atr: 3, alvo1_r: 1.5, alvo2_r: 3, intervalo_min_candles: 5,
    tempo_maior: { '1m': '15m', '3m': '15m', '5m': '1h', '15m': '1h', '30m': '4h', '1h': '4h', '4h': '1d', '1d': '1w' },
    radar: { top: 30, atualizar_lista_min: 60, fixas: [], so_fixas: false }
  };
  var RULES_VER = 0;
  function loadRules() {
    try {
      var x = new XMLHttpRequest();
      x.open('GET', 'regras.json?v=' + Math.floor(Date.now() / 6e5), true);
      x.onload = function () {
        if (x.status < 200 || x.status >= 300) return;
        try {
          var r = JSON.parse(x.responseText);
          for (var k in r) {
            if (!r.hasOwnProperty(k) || k.charAt(0) === '_' || !RULES.hasOwnProperty(k)) continue;
            if (k === 'radar' && r.radar && typeof r.radar === 'object') {
              for (var rk in r.radar) if (r.radar.hasOwnProperty(rk) && RULES.radar.hasOwnProperty(rk)) RULES.radar[rk] = r.radar[rk];
            } else RULES[k] = r[k];
          }
          radar.listT = 0;  // regras novas: refaz a lista do radar
          RULES_VER++;
          for (var s in charts) if (charts.hasOwnProperty(s)) { loadHTF(charts[s]); calcSignals(charts[s]); updateHead(charts[s]); scheduleDraw(charts[s]); }
        } catch (e) {}
      };
      x.send();
    } catch (e) {}
  }
  var charts = {};
  var tickers = [], tickMap = {}, tickTime = 0;
  var ws = null, wsGen = 0, wsAlive = false, lastMsg = 0, reconnTimer = null, pollTimer = null;
  var audioCtx = null;

  var $ = function (id) { return document.getElementById(id); };
  var grid = $('grid');

  // ---------- estado salvo ----------
  function load() {
    try {
      var s = window.localStorage.getItem('mc_state');
      if (s) {
        var o = JSON.parse(s);
        if (o.selected) state.selected = o.selected.slice(0, MAX_CHARTS);
        if (o.interval) state.interval = o.interval;
        if (o.levels) state.levels = o.levels;
        if (o.mode) state.mode = o.mode;
        if (o.ind === false) state.ind = false;
        if (o.sig === false) state.sig = false;
        if (o.radar === false) state.radar = false;
      }
    } catch (e) {}
  }
  // ---------- link com as moedas: ?m=BTC,SEI&t=15m ----------
  function linkQuery() {
    return '?m=' + state.selected.map(function (s) { return s.replace(/USDT$/, ''); }).join(',') + '&t=' + state.interval;
  }
  function linkUrl() { return location.href.split('?')[0].split('#')[0] + linkQuery(); }
  function syncUrl() {
    try { if (window.history && history.replaceState) history.replaceState(null, '', linkQuery()); } catch (e) {}
  }
  // aplica o link só quando é um link "novo"; reabrir o mesmo favorito mantém o que você mudou depois
  function applyLink() {
    var q = location.search;
    if (!q || q.indexOf('m=') < 0) return;
    var last = null;
    try { last = window.localStorage.getItem('mc_lastlink'); } catch (e) {}
    if (last === q) return;
    try { window.localStorage.setItem('mc_lastlink', q); } catch (e) {}
    var mm = /[?&]m=([^&]*)/.exec(q), tt = /[?&]t=([^&]*)/.exec(q);
    if (mm) {
      var list = decodeURIComponent(mm[1]).toUpperCase().split(/[,; ]+/), out = [];
      for (var i = 0; i < list.length && out.length < MAX_CHARTS; i++) {
        var s = list[i].replace(/[^A-Z0-9]/g, '');
        if (!s) continue;
        if (!/USDT$/.test(s)) s += 'USDT';
        if (out.indexOf(s) < 0) out.push(s);
      }
      if (out.length) state.selected = out;
    }
    if (tt && IV_MS[tt[1]]) state.interval = tt[1];
    // níveis pelo link (&e=entrada&a=alvo&s=stop) vão para a primeira moeda do link
    function num(nm) { var r = new RegExp('[?&]' + nm + '=([0-9.,]+)').exec(q); return r ? parseFloat(r[1].replace(',', '.')) : 0; }
    var le = num('e'), la = num('a'), ls = num('s');
    if (state.selected.length && (le > 0 || la > 0 || ls > 0)) {
      var lv = {};
      if (le > 0) { lv.e = le; lv.et = Date.now(); }
      if (la > 0) lv.a = la;
      if (ls > 0) lv.s = ls;
      state.levels[state.selected[0]] = lv;
    }
    save();
  }
  function copyText(txt) {
    var ok = false;
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.setAttribute('readonly', '');
      ta.style.position = 'absolute'; ta.style.left = '-9999px'; ta.style.fontSize = '16px';
      document.body.appendChild(ta);
      var r = document.createRange(); r.selectNodeContents(ta);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      ta.setSelectionRange(0, txt.length);
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) {}
    return ok;
  }

  function save() {
    syncUrl();
    try { window.localStorage.setItem('mc_state', JSON.stringify({ selected: state.selected, interval: state.interval, levels: state.levels, mode: state.mode, ind: state.ind, sig: state.sig, radar: state.radar })); } catch (e) {}
  }

  // ---------- rede ----------
  function get(path, ok, fail) {
    var tries = 0;
    function attempt() {
      var x = new XMLHttpRequest();
      x.open('GET', API_HOSTS[apiIdx] + path, true);
      x.timeout = 15000;
      x.onload = function () {
        if (x.status >= 200 && x.status < 300) {
          var d;
          try { d = JSON.parse(x.responseText); } catch (e) { return next(); }
          ok(d);
        } else { next(); }
      };
      x.onerror = next;
      x.ontimeout = next;
      x.send();
    }
    function next() {
      tries++;
      if (tries < API_HOSTS.length) { apiIdx = (apiIdx + 1) % API_HOSTS.length; attempt(); }
      else if (fail) { fail(); }
    }
    attempt();
  }

  function parseK(a) { return { t: a[0], o: +a[1], h: +a[2], l: +a[3], c: +a[4], v: +a[5] }; }

  // ---------- indicadores (calculados aqui mesmo, sem robô) ----------
  function ema(vals, n) {
    var k = 2 / (n + 1), out = [], e = 0, i;
    for (i = 0; i < vals.length; i++) {
      if (i < n - 1) { e += vals[i]; out.push(null); }
      else if (i === n - 1) { e = (e + vals[i]) / n; out.push(e); }
      else { e = vals[i] * k + e * (1 - k); out.push(e); }
    }
    return out;
  }
  function rsi(cl, n) {
    var out = [null], g = 0, l = 0, i, d, up, dn;
    for (i = 1; i < cl.length; i++) {
      d = cl[i] - cl[i - 1]; up = d > 0 ? d : 0; dn = d < 0 ? -d : 0;
      if (i <= n) {
        g += up; l += dn;
        if (i === n) { g /= n; l /= n; out.push(l === 0 ? 100 : 100 - 100 / (1 + g / l)); } else out.push(null);
      } else {
        g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n;
        out.push(l === 0 ? 100 : 100 - 100 / (1 + g / l));
      }
    }
    return out;
  }
  function calcInd(c) {
    var cl = c.candles.map(function (k) { return k.c; });
    c.e9 = ema(cl, 9); c.e21 = ema(cl, 21); c.rs = rsi(cl, 14);
    var n = cl.length - 1, p = cl[n], a = c.e9[n], b = c.e21[n], r = c.rs[n];
    c.rsi = r;
    // volume em relação à média dos 20 candles anteriores
    c.vr = [];
    var sum = 0, j;
    for (j = 0; j < c.candles.length; j++) {
      c.vr.push(j >= 20 && sum > 0 ? c.candles[j].v / (sum / 20) : null);
      sum += c.candles[j].v;
      if (j >= 20) sum -= c.candles[j - 20].v;
    }
    calcSignals(c);
    if (a == null || b == null || r == null) c.trend = '';
    else if (a > b && p > b && r > 50) c.trend = 'alta';
    else if (a < b && p < b && r < 50) c.trend = 'baixa';
    else c.trend = 'neutro';
  }

  // ---------- score de sinais de compra ----------
  function atr(cs, n) {
    var out = [], a = 0, sum = 0, i, k, tr;
    for (i = 0; i < cs.length; i++) {
      k = cs[i];
      tr = i === 0 ? k.h - k.l : Math.max(k.h - k.l, Math.abs(k.h - cs[i - 1].c), Math.abs(k.l - cs[i - 1].c));
      if (i < n) { sum += tr; if (i === n - 1) { a = sum / n; out.push(a); } else out.push(null); }
      else { a = (a * (n - 1) + tr) / n; out.push(a); }
    }
    return out;
  }

  // candles do tempo maior (ex.: você vê 15m, a página confere o 1h)
  function loadHTF(c) {
    var iv = state.interval, hiv = RULES.tempo_maior[iv];
    if (!hiv) { c.htf = null; return; }
    get('/api/v3/klines?symbol=' + c.sym + '&interval=' + hiv + '&limit=200', function (d) {
      if (!charts[c.sym] || iv !== state.interval) return;
      var h = d.map(parseK), cl = h.map(function (k) { return k.c; });
      c.htf = h; c.htfIv = hiv; c.hE9 = ema(cl, 9); c.hE21 = ema(cl, 21);
      c.htfKey = h.length + ':' + h[h.length - 1].t;
      calcSignals(c); updateHead(c); scheduleDraw(c);
    });
  }

  // resultado de um sinal: metade sai no alvo 1 (stop vai para a entrada), metade no alvo 2
  function resolveSig(s, cs, last) {
    var t1hit = false, j, q;
    s.res = 'aberto'; s.end = last;
    for (j = s.i + 1; j <= last; j++) {
      q = cs[j];
      if (!t1hit) {
        if (q.l <= s.s) { s.res = 'stop'; s.end = j; break; }   // na dúvida, conta o stop primeiro
        if (q.h >= s.t2) { s.res = 'alvo2'; s.end = j; break; }
        if (q.h >= s.t1) t1hit = true;
      } else {
        if (q.l <= s.e) { s.res = 'alvo1'; s.end = j; break; }
        if (q.h >= s.t2) { s.res = 'alvo2'; s.end = j; break; }
      }
    }
    if (s.res === 'aberto' && t1hit) s.res = 'alvo1aberto';
    var R = RULES;
    s.r = s.res === 'stop' ? -1 : s.res === 'alvo1' ? R.alvo1_r / 2 : s.res === 'alvo2' ? (R.alvo1_r + R.alvo2_r) / 2 : null;
  }

  function calcSignals(c) {
    var cs = c.candles, len = cs.length, R = RULES, last = len - 2;  // o último candle ainda está em formação
    if (last < 60 || !c.e9) { c.sigs = []; c.bt = null; c.act = null; return; }
    var key = cs[last].t + '|' + cs[last].c + '|' + (c.htfKey || '') + '|' + RULES_VER + '|' + state.interval;
    if (c.sigKey === key) return;
    c.sigKey = key;

    var ms = IV_MS[state.interval];
    var cl = cs.map(function (k) { return k.c; });
    var e50 = ema(cl, 50), at = atr(cs, R.atr_periodo), e9 = c.e9, e21 = c.e21, rs = c.rs;
    var h = (c.htf && c.htfIv === R.tempo_maior[state.interval]) ? c.htf : null;
    var hms = h ? IV_MS[c.htfIv] : 0, hi = -1;
    var sigs = [], lastStrong = -999, lastAny = -999, openUntil = -1, pausedUntil = -1, i, j, k;

    for (i = 50; i <= last; i++) {
      k = cs[i];
      // vela do tempo maior já FECHADA no momento deste candle
      if (h) while (hi + 1 < h.length && h[hi + 1].t + hms <= k.t + ms) hi++;
      if (e9[i] == null || e21[i] == null || rs[i] == null || at[i] == null || e50[i] == null) continue;
      var a = at[i], r = rs[i];

      // filtros
      var cross = 0;
      for (j = i - R.lateral_candles + 1; j <= i; j++) {
        if (j < 1 || e9[j - 1] == null || e21[j - 1] == null) continue;
        if ((e9[j] > e21[j]) !== (e9[j - 1] > e21[j - 1])) cross++;
      }
      if (cross >= R.lateral_max_cruzamentos) continue;               // mercado de lado
      if (a / k.c * 100 < R.atr_min_pct) continue;                    // pouca volatilidade
      if (r > R.rsi_bloqueio || (k.c - e21[i]) / a > R.esticado_max_atr) continue;  // esticado
      if (i <= pausedUntil) continue;                                  // pausa depois de um stop
      // subida longa: preço já subiu demais desde a mínima recente ("fim da festa")
      var lowRun = Infinity;
      for (j = Math.max(0, i - R.subida_candles + 1); j <= i; j++) if (cs[j].l < lowRun) lowRun = cs[j].l;
      if ((k.c - lowRun) / a > R.subida_max_atr) continue;

      // gatilho: rompimento ou pullback na EMA21
      var hh = -Infinity;
      for (j = Math.max(0, i - R.rompimento_candles); j < i; j++) if (cs[j].h > hh) hh = cs[j].h;
      var breakout = k.c > hh;
      var pullback = k.l <= e21[i] * (1 + R.pullback_tolerancia_pct / 100) && k.c > e21[i] && k.c > k.o && e9[i] > e21[i];
      if (!breakout && !pullback) continue;

      // pontuação
      var sc = 0, det = [];
      if (e9[i] > e21[i]) {
        var full = e9[i] > e9[i - 1] && e21[i] > e21[i - 1];
        sc += full ? R.peso_tendencia : R.peso_tendencia / 2; det.push('tendência' + (full ? '' : ' (½)'));
      }
      if (hi >= 0 && c.hE9[hi] != null && c.hE21[hi] != null && c.hE9[hi] > c.hE21[hi]) {
        var hfull = h[hi].c > c.hE21[hi];
        sc += hfull ? R.peso_tendencia_maior : R.peso_tendencia_maior / 2; det.push('tempo maior' + (hfull ? '' : ' (½)'));
      }
      if (k.c > e50[i]) { sc += R.peso_ema50; det.push('EMA50'); }
      if (r >= R.rsi_min && r <= R.rsi_max) {
        var rup = r > rs[i - 1];
        sc += rup ? R.peso_rsi : R.peso_rsi / 2; det.push('RSI' + (rup ? '' : ' (½)'));
      }
      var vr = c.vr[i];
      if (vr != null && vr >= R.volume_mult) { sc += R.peso_volume; det.push('volume'); }
      else if (vr != null && vr >= 1.2) { sc += R.peso_volume / 2; det.push('volume (½)'); }
      sc += R.peso_estrutura; det.push(breakout ? 'rompimento' : 'pullback');
      var rg = k.h - k.l;
      if (rg > 0 && (k.c - k.o) / rg >= 0.5 && (k.h - k.c) / rg <= 0.25) { sc += R.peso_candle; det.push('candle forte'); }
      sc = Math.round(sc);

      if (sc < R.score_fraco) continue;
      var strong = sc >= R.score_forte;
      // intervalo mínimo / não abrir outro sinal forte com um ainda aberto
      if (strong && (i - lastStrong < R.intervalo_min_candles || i <= openUntil)) continue;
      if (!strong && i - lastAny < R.intervalo_min_candles) continue;

      // stop e alvos
      var lowN = Infinity;
      for (j = Math.max(0, i - R.stop_candles + 1); j <= i; j++) if (cs[j].l < lowN) lowN = cs[j].l;
      var stop = Math.min(lowN, k.c - R.stop_atr * a), risk = k.c - stop;
      if (!(risk > 0) || risk > R.risco_max_atr * a) continue;        // stop longe demais

      var s = { i: i, t: k.t, score: sc, strong: strong, det: det, tipo: breakout ? 'rompimento' : 'pullback',
                e: k.c, s: stop, t1: k.c + risk * R.alvo1_r, t2: k.c + risk * R.alvo2_r };
      resolveSig(s, cs, last);
      sigs.push(s);
      lastAny = i;
      if (strong) {
        lastStrong = i; openUntil = s.end;
        // o stop só é conhecido quando acontece (candle s.end); a pausa começa dali
        if (s.res === 'stop') pausedUntil = s.end + R.pausa_apos_stop_candles;
      }
    }

    // tira o sinal fraco quando um forte aparece logo em seguida (evita etiquetas sobrepostas)
    sigs = sigs.filter(function (g, ix) {
      if (g.strong) return true;
      for (var q = ix + 1; q < sigs.length; q++) {
        if (sigs[q].i - g.i >= R.intervalo_min_candles) break;
        if (sigs[q].strong) return false;
      }
      return true;
    });

    // teste no histórico (só sinais fortes)
    var bt ={ n: 0, stop: 0, a1: 0, a2: 0, ab: 0, r: 0 };
    for (j = 0; j < sigs.length; j++) {
      var g = sigs[j];
      if (!g.strong) continue;
      bt.n++;
      if (g.res === 'stop') bt.stop++; else if (g.res === 'alvo1') bt.a1++; else if (g.res === 'alvo2') bt.a2++; else bt.ab++;
      if (g.r != null) bt.r += g.r;
    }
    c.sigs = sigs; c.bt = bt;

    // sinal forte ainda em andamento
    c.act = null;
    for (j = sigs.length - 1; j >= 0; j--) {
      if (sigs[j].strong) { if (sigs[j].res === 'aberto' || sigs[j].res === 'alvo1aberto') c.act = sigs[j]; break; }
    }

    // sinal novo no candle que acabou de fechar: alerta
    var lastS = sigs.length ? sigs[sigs.length - 1] : null;
    if (c.el && lastS && lastS.strong && lastS.i === last && c.alertT !== lastS.t && Date.now() - (lastS.t + ms) < Math.min(ms, 3e5)) {
      c.alertT = lastS.t;
      if (state.sig) {
        beep(1046);
        c.el.className = c.el.className.replace(/ ?sig-new/g, '') + ' sig-new';
        setTimeout(function () { c.el.className = c.el.className.replace(/ ?sig-new/g, ''); }, 30000);
      }
    }
  }

  // variação de 1h: preço de abertura da janela de 1h, atualizado a cada minuto
  function loadH1() {
    state.selected.forEach(function (s) {
      get('/api/v3/ticker?symbol=' + s + '&windowSize=1h&type=MINI', function (d) {
        if (d && +d.openPrice > 0) { h1[s] = +d.openPrice; if (charts[s]) updateHead(charts[s]); }
      });
    });
  }
  function open1h(c) {
    if (h1[c.sym]) return h1[c.sym];
    // plano B: tira dos próprios candles (só funciona em tempos menores que 1h)
    var ms = IV_MS[state.interval];
    if (!c.candles.length || ms >= 36e5) return null;
    var alvo = c.candles[c.candles.length - 1].t + ms - 36e5;
    for (var i = c.candles.length - 1; i >= 0; i--) if (c.candles[i].t <= alvo) return c.candles[i].o;
    return null;
  }

  function merge(c, arr) {
    if (!c.candles.length) return;
    for (var i = 0; i < arr.length; i++) {
      var k = arr[i], last = c.candles[c.candles.length - 1];
      if (k.t === last.t) { c.candles[c.candles.length - 1] = k; }
      else if (k.t > last.t) { c.candles.push(k); if (c.candles.length > LIMIT) c.candles.shift(); }
    }
    calcInd(c);
    updateHead(c);
    scheduleDraw(c);
  }

  function loadKlines(c) {
    if (c.loading) return;
    c.loading = true;
    var interval = state.interval;
    get('/api/v3/klines?symbol=' + c.sym + '&interval=' + interval + '&limit=' + LIMIT, function (d) {
      c.loading = false;
      if (!charts[c.sym] || interval !== state.interval) return;
      c.candles = d.map(parseK);
      c.err = '';
      c.sigKey = null;
      calcInd(c);
      loadHTF(c);
      updateHead(c);
      scheduleDraw(c);
    }, function () {
      c.loading = false;
      c.err = 'Sem conexão com a Binance';
      scheduleDraw(c);
    });
  }

  function loadTickers(cb) {
    function done(d) {
      var out = [];
      for (var i = 0; i < d.length; i++) {
        var t = d[i], s = t.symbol;
        if (s.length < 5 || s.slice(-4) !== 'USDT') continue;
        var base = s.slice(0, -4);
        if (SKIP[base]) continue;
        var qv = +t.quoteVolume, last = +t.lastPrice, open = +t.openPrice;
        if (!(qv > 0) || !(last > 0)) continue;
        out.push({ s: s, b: base, p: last, o: open, qv: qv, ch: open > 0 ? (last - open) / open * 100 : 0 });
      }
      out.sort(function (a, b) { return b.qv - a.qv; });
      tickers = out; tickMap = {};
      for (var j = 0; j < out.length; j++) tickMap[out[j].s] = out[j];
      tickTime = Date.now();
      if (cb) cb(true);
    }
    get('/api/v3/ticker/24hr?type=MINI', done, function () {
      get('/api/v3/ticker/24hr', done, function () { if (cb) cb(false); });
    });
  }

  // ---------- WebSocket ao vivo (com plano B por consulta a cada 5s) ----------
  function connect() {
    wsGen++;
    var gen = wsGen;
    wsAlive = false;
    if (ws) { try { ws.onclose = null; ws.onmessage = null; ws.onerror = null; ws.close(); } catch (e) {} ws = null; }
    clearTimeout(reconnTimer);
    if (!state.selected.length) { stopPolling(); setStatus('', 'parado'); return; }
    startPolling();
    if (!window.WebSocket) return;
    var streams = state.selected.map(function (s) { return s.toLowerCase() + '@kline_' + state.interval; }).join('/');
    var opened = false, sock;
    try { sock = new WebSocket(WS_HOSTS[wsIdx] + '/stream?streams=' + streams); } catch (e) { fail(); return; }
    ws = sock;
    sock.onopen = function () { if (gen === wsGen) opened = true; };
    sock.onmessage = function (ev) {
      if (gen !== wsGen) return;
      lastMsg = Date.now();
      if (!wsAlive) { wsAlive = true; stopPolling(); setStatus('live', 'ao vivo'); }
      handleMsg(ev.data);
    };
    sock.onerror = function () {};
    sock.onclose = function () { if (gen === wsGen) fail(); };
    function fail() {
      if (gen !== wsGen) return;
      wsAlive = false; ws = null;
      if (!opened) wsIdx = (wsIdx + 1) % WS_HOSTS.length;
      startPolling();
      reconnTimer = setTimeout(connect, 15000);
    }
  }

  function handleMsg(raw) {
    var m;
    try { m = JSON.parse(raw); } catch (e) { return; }
    var d = m.data || m;
    if (!d || !d.k) return;
    var c = charts[d.s];
    if (!c || d.k.i !== state.interval) return;
    var k = d.k;
    merge(c, [{ t: k.t, o: +k.o, h: +k.h, l: +k.l, c: +k.c, v: +k.v }]);
  }

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(pollOnce, POLL_MS);
    pollOnce();
  }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  function pollOnce() {
    state.selected.forEach(function (s) {
      var c = charts[s];
      if (!c) return;
      if (!c.candles.length) { loadKlines(c); return; }
      var interval = state.interval;
      get('/api/v3/klines?symbol=' + s + '&interval=' + interval + '&limit=2', function (d) {
        if (interval !== state.interval || wsAlive) return;
        merge(c, d.map(parseK));
        setStatus('poll', 'atualiza a cada 5s');
      }, function () { if (!wsAlive) setStatus('off', 'sem conexão'); });
    });
  }

  // conexão "morta" sem fechar (comum depois que o iPad dorme)
  setInterval(function () {
    if (wsAlive && Date.now() - lastMsg > 25000) connect();
  }, 5000);

  function setStatus(cls, txt) {
    var el = $('status');
    el.className = cls;
    el.getElementsByTagName('span')[0].textContent = txt;
  }

  // ---------- painéis ----------
  function makePanel(sym) {
    var el = document.createElement('div');
    el.className = 'panel';
    el.innerHTML =
      '<div class="head"><button class="big">⤢</button><button class="x">✕</button><b class="sym"></b><span class="px"></span><span class="badge"></span><span class="sg"></span><span class="chg"></span><span class="tr"></span></div>' +
      '<div class="lv">' +
      '<input class="e" data-k="e" type="text" placeholder="Entrada" autocomplete="off" autocorrect="off" spellcheck="false">' +
      '<input class="a" data-k="a" type="text" placeholder="Alvo" autocomplete="off" autocorrect="off" spellcheck="false">' +
      '<input class="s" data-k="s" type="text" placeholder="Stop" autocomplete="off" autocorrect="off" spellcheck="false">' +
      '<span class="rr"></span></div>' +
      '<canvas></canvas>' +
      '<div class="zb"><button data-z="out">−</button><button data-z="in">+</button><button data-z="r">⟲</button></div>';
    grid.appendChild(el);
    var c = {
      sym: sym, el: el, candles: [], err: '', hit: '', loading: false, dirty: false,
      canvas: el.getElementsByTagName('canvas')[0],
      symEl: el.querySelector('.sym'), pxEl: el.querySelector('.px'), chgEl: el.querySelector('.chg'),
      badgeEl: el.querySelector('.badge'), rrEl: el.querySelector('.rr'), trEl: el.querySelector('.tr'), sgEl: el.querySelector('.sg')
    };
    c.ctx = c.canvas.getContext('2d');
    c.symEl.textContent = sym.replace(/USDT$/, '') + '/USDT';

    el.querySelector('.x').onclick = function () {
      state.selected = state.selected.filter(function (s) { return s !== sym; });
      if (expanded === sym) expanded = null;
      save(); rebuild(false);
    };
    el.querySelector('.big').onclick = function () { toggleExpand(c); };
    c.vn = null; c.pan = 0;   // zoom (candles visíveis) e deslocamento para trás
    var zbs = el.querySelectorAll('.zb button');
    for (var zi = 0; zi < zbs.length; zi++) {
      zbs[zi].onclick = function () {
        var z = this.getAttribute('data-z');
        if (z === 'r') { c.vn = null; c.pan = 0; }
        else zoomBy(c, z === 'in' ? 0.7 : 1 / 0.7);
        scheduleDraw(c);
      };
    }
    bindGestures(c);

    // preenche Entrada / Alvo / Stop (usado pelo sinal e pelo link)
    c.setLevels = function (e, a, s, et) {
      var lv = {};
      if (e > 0) { lv.e = +(+e).toPrecision(6); lv.et = et || Date.now(); }
      if (a > 0) lv.a = +(+a).toPrecision(6);
      if (s > 0) lv.s = +(+s).toPrecision(6);
      if (lv.e || lv.a || lv.s) state.levels[sym] = lv; else delete state.levels[sym];
      var ins = el.querySelectorAll('.lv input');
      for (var q = 0; q < ins.length; q++) {
        var kk = ins[q].getAttribute('data-k');
        ins[q].value = lv[kk] ? fmtL(lv[kk]) : '';
      }
      save(); updateHead(c); scheduleDraw(c);
    };
    c.sgEl.onclick = function () {
      var g = c.act;
      if (!g) return;
      var msg = 'Sinal de COMPRA · score ' + g.score + ' (' + g.tipo + ')\n' +
        'Critérios: ' + g.det.join(', ') + '\n\n' +
        'Entrada: ' + fmt(g.e) + '\nAlvo 1: ' + fmt(g.t1) + '\nAlvo 2: ' + fmt(g.t2) + '\nStop: ' + fmt(g.s) + '\n\n' +
        'Usar Entrada, Alvo 1 e Stop nos seus campos?';
      var L0 = state.levels[sym];
      if (L0 && L0.e) msg += '\n(isso substitui os valores atuais)';
      if (confirm(msg)) c.setLevels(g.e, g.t1, g.s, g.t + IV_MS[state.interval]);
    };
    var L = state.levels[sym] || {};
    var inputs = el.querySelectorAll('.lv input');
    for (var i = 0; i < inputs.length; i++) {
      (function (inp) {
        var k = inp.getAttribute('data-k');
        if (L[k]) inp.value = String(L[k]);
        inp.addEventListener('input', function () {
          var v = parseFloat(inp.value.replace(',', '.'));
          var lv = state.levels[sym] || (state.levels[sym] = {});
          // grava data/hora no momento em que a entrada é preenchida
          if (k === 'e') {
            if (v > 0 && !lv.e) lv.et = Date.now();
            if (!(v > 0)) delete lv.et;
          }
          if (v > 0) lv[k] = v; else delete lv[k];
          if (!lv.e && !lv.a && !lv.s) delete state.levels[sym];
          save(); updateHead(c); scheduleDraw(c);
        });
      })(inputs[i]);
    }
    return c;
  }

  // ---------- ampliar / zoom / arrastar ----------
  function toggleExpand(c) {
    expanded = expanded === c.sym ? null : c.sym;
    if (!expanded) { c.vn = null; c.pan = 0; }
    layout();
  }
  function curVn(c) { return c.vn || c.autoN || 60; }
  function zoomBy(c, f) {
    var len = c.candles.length || LIMIT;
    c.vn = Math.max(15, Math.min(len, Math.round(curVn(c) * f)));
    c.pan = Math.max(0, Math.min(c.pan, len - c.vn));
  }
  function panBy(c, dx) {
    if (!c.step) return;
    var len = c.candles.length, vn = curVn(c);
    c.pan = Math.max(0, Math.min(len - vn, c.pan + dx / c.step));
    scheduleDraw(c);
  }
  function bindGestures(c) {
    var cv = c.canvas, lastTap = 0, tapX = 0, tapY = 0, moved = false;
    var startX = 0, startPan = 0, pinch0 = 0, vn0 = 0, mode = '';
    function dist(t) { var dx = t[0].pageX - t[1].pageX, dy = t[0].pageY - t[1].pageY; return Math.sqrt(dx * dx + dy * dy); }
    var opt = { passive: false };
    cv.addEventListener('touchstart', function (e) {
      e.preventDefault();
      moved = false;
      if (e.touches.length === 2) { mode = 'pinch'; pinch0 = dist(e.touches); vn0 = curVn(c); }
      else if (e.touches.length === 1) { mode = 'pan'; startX = e.touches[0].pageX; startPan = c.pan; tapX = startX; tapY = e.touches[0].pageY; }
    }, opt);
    cv.addEventListener('touchmove', function (e) {
      e.preventDefault();
      if (expanded !== c.sym) { moved = true; return; }
      if (mode === 'pinch' && e.touches.length === 2) {
        moved = true;
        var len = c.candles.length || LIMIT;
        c.vn = Math.max(15, Math.min(len, Math.round(vn0 * pinch0 / dist(e.touches))));
        c.pan = Math.max(0, Math.min(c.pan, len - c.vn));
        scheduleDraw(c);
      } else if (mode === 'pan' && e.touches.length === 1) {
        var dx = e.touches[0].pageX - startX;
        if (Math.abs(dx) > 8) moved = true;
        c.pan = startPan; panBy(c, dx);
      }
    }, opt);
    cv.addEventListener('touchend', function (e) {
      e.preventDefault();
      if (e.touches.length) return;
      if (mode === 'pan' && !moved) {
        var now = Date.now();
        if (now - lastTap < 350 && Math.abs(tapX - lastX) < 30) { lastTap = 0; toggleExpand(c); }
        else { lastTap = now; lastX = tapX; }
      }
      mode = '';
    }, opt);
    var lastX = 0;
    // computador: duplo clique, roda do mouse e arrastar
    cv.addEventListener('dblclick', function () { toggleExpand(c); });
    cv.addEventListener('wheel', function (e) {
      if (expanded !== c.sym) return;
      e.preventDefault();
      zoomBy(c, e.deltaY > 0 ? 1.15 : 1 / 1.15); scheduleDraw(c);
    }, opt);
    var drag = false;
    cv.addEventListener('mousedown', function (e) { if (expanded === c.sym) { drag = true; startX = e.pageX; startPan = c.pan; } });
    window.addEventListener('mousemove', function (e) { if (drag) { c.pan = startPan; panBy(c, e.pageX - startX); } });
    window.addEventListener('mouseup', function () { drag = false; });
  }

  function rebuild(reloadAll) {
    var s;
    for (s in charts) {
      if (charts.hasOwnProperty(s) && state.selected.indexOf(s) < 0) { grid.removeChild(charts[s].el); delete charts[s]; }
    }
    state.selected.forEach(function (sym) {
      if (!charts[sym]) { charts[sym] = makePanel(sym); loadKlines(charts[sym]); }
      else if (reloadAll) { charts[sym].candles = []; charts[sym].loading = false; loadKlines(charts[sym]); }
    });
    $('empty').style.display = state.selected.length ? 'none' : 'block';
    layout();
    connect();
    loadH1();
  }

  function layout() {
    var W = grid.clientWidth, H = grid.clientHeight, n = state.selected.length;
    var land = W > H, boxes = [];
    if (n === 1) boxes = [[0, 0, 1, 1]];
    else if (n === 2) boxes = land ? [[0, 0, 0.5, 1], [0.5, 0, 0.5, 1]] : [[0, 0, 1, 0.5], [0, 0.5, 1, 0.5]];
    else if (n === 3) boxes = [[0, 0, 0.5, 0.5], [0.5, 0, 0.5, 0.5], [0, 0.5, 1, 0.5]];
    else if (n === 4) boxes = [[0, 0, 0.5, 0.5], [0.5, 0, 0.5, 0.5], [0, 0.5, 0.5, 0.5], [0.5, 0.5, 0.5, 0.5]];
    if (expanded && state.selected.indexOf(expanded) < 0) expanded = null;
    state.selected.forEach(function (sym, i) {
      var c = charts[sym], b = boxes[i];
      if (!c || !b) return;
      if (expanded) {
        if (sym !== expanded) { c.el.className = c.el.className.replace(/ ?(hide|big)/g, '') + ' hide'; return; }
        b = [0, 0, 1, 1];
      }
      c.el.className = c.el.className.replace(/ ?(hide|big)/g, '') + (expanded ? ' big' : '');
      c.el.querySelector('.big').textContent = expanded ? '⤡' : '⤢';
      var x = Math.round(b[0] * W), y = Math.round(b[1] * H);
      var w = Math.round((b[0] + b[2]) * W) - x, h = Math.round((b[1] + b[3]) * H) - y;
      c.el.style.left = x + 'px'; c.el.style.top = y + 'px';
      c.el.style.width = w + 'px'; c.el.style.height = h + 'px';
      c.cw = Math.max(50, w - 2);
      c.ch = Math.max(50, h - 2 - 34 - 40);
      c.canvas.style.width = c.cw + 'px';
      c.canvas.style.height = c.ch + 'px';
      scheduleDraw(c);
    });
  }

  function lastPrice(c) { return c.candles.length ? c.candles[c.candles.length - 1].c : null; }

  function updateHead(c) {
    var p = lastPrice(c);
    c.pxEl.textContent = p == null ? '' : fmt(p);
    var t = tickMap[c.sym], o1 = open1h(c), parts = [];
    function pct(open, label) {
      var ch = (p - open) / open * 100;
      return '<b>' + label + '</b> <span class="' + (ch >= 0 ? 'up' : 'dn') + '">' + (ch >= 0 ? '+' : '') + ch.toFixed(2) + '%</span>';
    }
    if (p != null && o1 > 0) parts.push(pct(o1, '1h'));
    if (p != null && t && t.o > 0) parts.push(pct(t.o, '24h'));
    c.chgEl.className = 'chg';
    c.chgEl.innerHTML = parts.join(' &nbsp;');

    var g = state.sig ? c.act : null;
    if (g) {
      c.sgEl.className = 'sg' + (g.res === 'alvo1aberto' ? ' t1' : '');
      c.sgEl.textContent = g.res === 'alvo1aberto' ? '◆ ALVO 1 ✓' : '◆ COMPRA ' + g.score;
    } else { c.sgEl.textContent = ''; }

    if (state.ind && c.trend) {
      c.trEl.className = 'tr ' + c.trend;
      c.trEl.textContent = c.trend === 'alta' ? '▲ ALTA' : c.trend === 'baixa' ? '▼ BAIXA' : '● NEUTRO';
    } else { c.trEl.textContent = ''; }

    var L = state.levels[c.sym] || {}, hit = '', l1 = [], l2 = [];
    // resultado ao vivo desde a entrada (compra se o alvo está acima da entrada)
    if (L.e && p != null) {
      var isLong = L.a ? L.a > L.e : (L.s ? L.s < L.e : true);
      var pl = (p - L.e) / L.e * 100 * (isLong ? 1 : -1);
      l2.push('<span class="pl ' + (pl >= 0 ? 'up' : 'dn') + '">' + (pl >= 0 ? '+' : '') + pl.toFixed(2) + '%</span>');
    }
    if (L.et) l1.push('<span class="et">⏱ ' + dtShort(L.et) + ' · ' + durLabel(Date.now() - L.et) + '</span>');
    if (L.e && L.a && L.s) {
      var risk = Math.abs(L.e - L.s), gain = Math.abs(L.a - L.e);
      if (risk > 0) l2.push('R:R 1:' + (gain / risk).toFixed(1));
    }
    c.rrEl.innerHTML = l1.join('') + (l1.length && l2.length ? '<br>' : '') + l2.join(' · ');
    if (p != null && L.a && L.s) {
      var ref = L.e || (L.a + L.s) / 2;
      var long = L.a > ref;
      if (long) { if (p >= L.a) hit = 'alvo'; else if (p <= L.s) hit = 'stop'; }
      else { if (p <= L.a) hit = 'alvo'; else if (p >= L.s) hit = 'stop'; }
    }
    if (hit !== c.hit) {
      if (hit && c.hit === '') beep(hit === 'alvo' ? 880 : 300);
      c.hit = hit;
      c.el.className = c.el.className.replace(/ ?hit-\w+/g, '') + (hit ? ' hit-' + hit : '');
      c.badgeEl.className = 'badge' + (hit ? ' ' + hit : '');
      c.badgeEl.textContent = hit === 'alvo' ? '✓ ALVO' : hit === 'stop' ? '✕ STOP' : '';
    }
  }

  // ---------- desenho ----------
  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame || function (f) { return setTimeout(f, 30); };
  var rafPending = false;
  function scheduleDraw(c) {
    c.dirty = true;
    if (rafPending) return;
    rafPending = true;
    raf(function () {
      rafPending = false;
      for (var s in charts) if (charts.hasOwnProperty(s) && charts[s].dirty) { charts[s].dirty = false; draw(charts[s]); }
    });
  }

  function fmt(p) {
    if (p == null || isNaN(p)) return '-';
    var a = Math.abs(p);
    var d = a >= 1000 ? 2 : a >= 100 ? 3 : a >= 1 ? 4 : a >= 0.01 ? 5 : a >= 0.0001 ? 7 : 8;
    return p.toFixed(d);
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function dtLabel(t) { var d = new Date(t); return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  // data curta: só a hora se for hoje
  function dtShort(t) {
    var d = new Date(t), n = new Date();
    var hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    return d.toDateString() === n.toDateString() ? hm : pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + ' ' + hm;
  }
  function durLabel(ms) {
    var m = Math.max(0, Math.floor(ms / 6e4)), h = Math.floor(m / 60), d = Math.floor(h / 24);
    if (d > 0) return d + 'd ' + (h % 24) + 'h';
    if (h > 0) return h + 'h' + pad2(m % 60);
    return m + 'min';
  }
  // mostra o nível exatamente como foi digitado (sem arredondar)
  function fmtL(v) { var s = String(v); return s.indexOf('e') >= 0 ? fmt(v) : s; }
  function tLabel(t) {
    var d = new Date(t);
    if (state.interval === '1d' || state.interval === '4h') return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function tag(ctx, x, y, w, text, bg, fg) {
    ctx.fillStyle = bg;
    ctx.fillRect(x, y - 9, w, 18);
    ctx.fillStyle = fg;
    ctx.fillText(text, x + 4, y + 4);
  }

  function draw(c) {
    var cv = c.canvas, ctx = c.ctx, dpr = window.devicePixelRatio || 1;
    var w = c.cw || cv.clientWidth, h = c.ch || cv.clientHeight;
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0e1116';
    ctx.fillRect(0, 0, w, h);
    ctx.font = '11px -apple-system, Helvetica, Arial, sans-serif';

    if (!c.candles.length) {
      ctx.fillStyle = '#6b7686';
      ctx.font = '14px -apple-system, Helvetica, Arial, sans-serif';
      ctx.fillText(c.err || 'Carregando...', 12, 24);
      return;
    }

    var axisW = 74, padT = 10, padB = 20;
    var plotW = w - axisW, plotH = h - padT - padB;
    var volH = Math.round(plotH * 0.16), priceH = plotH - volH - 4;
    var len = c.candles.length;
    c.autoN = Math.max(15, Math.min(len, Math.floor(plotW / 6), 150));
    var n = c.vn ? Math.max(15, Math.min(len, c.vn)) : c.autoN;
    c.pan = Math.max(0, Math.min(c.pan || 0, len - n));
    var off = Math.max(0, len - n - Math.round(c.pan));
    var vis = c.candles.slice(off, off + n);
    n = vis.length;
    var hi = -Infinity, lo = Infinity, vmax = 0, i, k;
    for (i = 0; i < n; i++) {
      if (vis[i].h > hi) hi = vis[i].h; if (vis[i].l < lo) lo = vis[i].l;
      if (vis[i].v > vmax) vmax = vis[i].v;
    }
    var L = state.levels[c.sym] || {};
    var lvList = [];
    if (L.e) lvList.push({ v: L.e, col: '#3b82f6', n: 'E' });
    if (L.a) lvList.push({ v: L.a, col: '#22c55e', n: 'A' });
    if (L.s) lvList.push({ v: L.s, col: '#ef4444', n: 'S' });
    for (i = 0; i < lvList.length; i++) { if (lvList[i].v > hi) hi = lvList[i].v; if (lvList[i].v < lo) lo = lvList[i].v; }
    // sinal ativo: garante que stop e alvos apareçam na escala
    var act = state.sig && c.act && c.act.i >= off && c.act.i < off + n ? c.act : null;
    if (act) { if (act.t2 > hi) hi = act.t2; if (act.s < lo) lo = act.s; }
    var rng = hi - lo;
    if (!(rng > 0)) rng = Math.abs(hi) * 0.01 || 1;
    hi += rng * 0.05; lo -= rng * 0.05; rng = hi - lo;
    function y(p) { return padT + (hi - p) / rng * priceH; }
    var step = plotW / n, bw = Math.max(1, Math.floor(step * 0.65));
    c.step = step;
    function xAt(i) { return Math.floor(i * step + step / 2) + 0.5; }

    // grade
    ctx.strokeStyle = '#1c222b'; ctx.lineWidth = 1; ctx.fillStyle = '#6b7686';
    for (i = 0; i <= 4; i++) {
      var gp = lo + rng * i / 4, gy = Math.round(y(gp)) + 0.5;
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(plotW, gy); ctx.stroke();
      ctx.fillText(fmt(gp), plotW + 5, gy + 4);
    }

    // volume (barras discretas no rodapé)
    var vBase = padT + plotH;
    if (vmax > 0) {
      for (i = 0; i < n; i++) {
        k = vis[i];
        var vh = Math.max(1, Math.round(k.v / vmax * volH));
        var vr = c.vr ? c.vr[off + i] : null;
        if (vr != null && vr >= 2) {
          // volume fora do normal: só a barra acende, na cor do candle
          ctx.fillStyle = k.c >= k.o ? '#22e0c8' : '#ff4d4d';
        } else {
          ctx.fillStyle = k.c >= k.o ? 'rgba(38,166,154,0.35)' : 'rgba(239,83,80,0.35)';
        }
        ctx.fillRect(Math.round(xAt(i) - bw / 2), vBase - vh, bw, vh);
      }
      // multiplicador do candle atual em relação à média de 20
      var vrNow = c.vr ? c.vr[len - 1] : null;
      ctx.fillStyle = '#4b5563';
      ctx.fillText('Vol', 4, vBase - volH + 10);
      if (vrNow != null) {
        var lc = c.candles[len - 1];
        ctx.fillStyle = vrNow >= 2 ? (lc.c >= lc.o ? '#22e0c8' : '#ff4d4d') : '#6b7686';
        ctx.fillText('x' + vrNow.toFixed(1) + ' média', 26, vBase - volH + 10);
      }
    }

    // candles
    for (i = 0; i < n; i++) {
      k = vis[i];
      var cx = xAt(i);
      var up = k.c >= k.o, col = up ? '#26a69a' : '#ef5350';
      ctx.strokeStyle = col; ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(cx, y(k.h)); ctx.lineTo(cx, y(k.l)); ctx.stroke();
      var top = y(Math.max(k.o, k.c)), bot = y(Math.min(k.o, k.c));
      ctx.fillRect(Math.round(cx - bw / 2), Math.round(top), bw, Math.max(1, Math.round(bot - top)));
    }

    // médias EMA 9 / EMA 21 + setas de cruzamento
    if (state.ind && c.e9) {
      var lines = [[c.e9, '#f59e0b'], [c.e21, '#a78bfa']];
      for (var li = 0; li < 2; li++) {
        var arr = lines[li][0], started = false;
        ctx.strokeStyle = lines[li][1]; ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (i = 0; i < n; i++) {
          var ev = arr[off + i];
          if (ev == null) continue;
          if (!started) { ctx.moveTo(xAt(i), y(ev)); started = true; } else ctx.lineTo(xAt(i), y(ev));
        }
        ctx.stroke();
      }
      ctx.lineWidth = 1;
      for (i = 1; i < n; i++) {
        var a0 = c.e9[off + i - 1], b0 = c.e21[off + i - 1], a1 = c.e9[off + i], b1 = c.e21[off + i];
        if (a0 == null || b0 == null || a1 == null || b1 == null) continue;
        var tx0 = xAt(i);
        if (a0 <= b0 && a1 > b1) {          // cruzou para cima
          var ty = y(vis[i].l) + 6;
          ctx.fillStyle = '#22c55e';
          ctx.beginPath(); ctx.moveTo(tx0, ty); ctx.lineTo(tx0 - 5, ty + 8); ctx.lineTo(tx0 + 5, ty + 8); ctx.closePath(); ctx.fill();
        } else if (a0 >= b0 && a1 < b1) {   // cruzou para baixo
          var ty2 = y(vis[i].h) - 6;
          ctx.fillStyle = '#ef4444';
          ctx.beginPath(); ctx.moveTo(tx0, ty2); ctx.lineTo(tx0 - 5, ty2 - 8); ctx.lineTo(tx0 + 5, ty2 - 8); ctx.closePath(); ctx.fill();
        }
      }
      // legenda
      // legenda no canto esquerdo (abaixo do resumo do teste, se houver)
      var leg = 'EMA9  EMA21' + (c.rsi != null ? '   RSI ' + Math.round(c.rsi) : '');
      var lw = ctx.measureText(leg).width, lx = 6, ly = (state.sig && c.bt) ? padT + 27 : padT + 11;
      ctx.fillStyle = 'rgba(14,17,22,0.8)';
      ctx.fillRect(2, ly - 11, lw + 8, 15);
      ctx.fillStyle = '#f59e0b'; ctx.fillText('EMA9', lx, ly);
      ctx.fillStyle = '#a78bfa'; ctx.fillText('EMA21', lx + ctx.measureText('EMA9  ').width, ly);
      if (c.rsi != null) {
        ctx.fillStyle = c.rsi >= 70 ? '#ef4444' : c.rsi <= 30 ? '#22c55e' : '#8b95a5';
        ctx.fillText('RSI ' + Math.round(c.rsi), lx + ctx.measureText('EMA9  EMA21   ').width, ly);
      }
    }

    // sinais de compra: etiqueta com o score abaixo do candle
    if (state.sig && c.sigs) {
      ctx.font = 'bold 10px -apple-system, Helvetica, Arial, sans-serif';
      for (var si = 0; si < c.sigs.length; si++) {
        var sg = c.sigs[si], vi = sg.i - off;
        if (vi < 0 || vi >= n) continue;
        var sx = xAt(vi), sy = y(vis[vi].l) + 18, txt = String(sg.score);
        var tw = ctx.measureText(txt).width + 8;
        ctx.globalAlpha = sg.strong ? 1 : 0.6;
        ctx.fillStyle = sg.strong ? '#2563eb' : '#334155';
        ctx.beginPath(); ctx.moveTo(sx, sy - 5); ctx.lineTo(sx - 4, sy); ctx.lineTo(sx + 4, sy); ctx.closePath(); ctx.fill();
        ctx.fillRect(Math.round(sx - tw / 2), sy, Math.round(tw), 14);
        ctx.fillStyle = sg.strong ? '#fff' : '#cbd5e1';
        ctx.fillText(txt, Math.round(sx - tw / 2 + 4), sy + 11);
        // como terminou (nos sinais fortes já encerrados)
        if (sg.strong && sg.res !== 'aberto' && sg.res !== 'alvo1aberto') {
          ctx.fillStyle = sg.res === 'stop' ? '#ef4444' : '#22c55e';
          ctx.fillText(sg.res === 'stop' ? '✕' : sg.res === 'alvo2' ? '✓✓' : '✓', Math.round(sx - tw / 2), sy + 26);
        }
        ctx.globalAlpha = 1;
      }
      ctx.font = '11px -apple-system, Helvetica, Arial, sans-serif';

      // linhas do sinal ativo, a partir do candle do sinal
      if (act) {
        var ax = xAt(act.i - off), lines2 = [
          [act.t2, '#4ade80', 'Alvo 2'], [act.t1, '#4ade80', 'Alvo 1'], [act.e, '#93c5fd', 'Sinal'], [act.s, '#f87171', 'Stop']
        ];
        ctx.fillStyle = 'rgba(59,130,246,0.07)';
        ctx.fillRect(ax, y(act.t2), plotW - ax, y(act.s) - y(act.t2));
        for (var la = 0; la < lines2.length; la++) {
          var lyy = Math.round(y(lines2[la][0])) + 0.5;
          ctx.strokeStyle = lines2[la][1]; ctx.globalAlpha = 0.8;
          ctx.beginPath(); ctx.moveTo(ax, lyy); ctx.lineTo(plotW, lyy); ctx.stroke();
          ctx.globalAlpha = 1;
          var lt = lines2[la][2] + ' ' + fmt(lines2[la][0]), ltw = ctx.measureText(lt).width;
          ctx.fillStyle = 'rgba(14,17,22,0.85)';
          ctx.fillRect(plotW - ltw - 8, lyy - 14, ltw + 6, 13);
          ctx.fillStyle = lines2[la][1];
          ctx.fillText(lt, plotW - ltw - 5, lyy - 4);
        }
      }

      // teste no histórico (sinais fortes)
      var bt = c.bt;
      if (bt) {
        var fech = bt.stop + bt.a1 + bt.a2, btTxt;
        if (!bt.n) btTxt = 'Teste ' + len + ' candles: nenhum sinal forte';
        else btTxt = 'Teste ' + len + 'c: ' + bt.n + ' sinais · ✓' + (bt.a1 + bt.a2) + ' ✕' + bt.stop +
          (bt.ab ? ' · ' + bt.ab + ' aberto' : '') +
          (fech ? ' · ' + Math.round((bt.a1 + bt.a2) / fech * 100) + '% · ' + (bt.r >= 0 ? '+' : '') + bt.r.toFixed(1) + 'R' : '');
        ctx.fillStyle = 'rgba(14,17,22,0.8)';
        ctx.fillRect(2, padT, ctx.measureText(btTxt).width + 8, 15);
        ctx.fillStyle = !fech ? '#8b95a5' : bt.r >= 0 ? '#4ade80' : '#f87171';
        ctx.fillText(btTxt, 6, padT + 11);
      }
    }

    // horários
    ctx.fillStyle = '#6b7686';
    var every = Math.max(1, Math.round(n / Math.max(2, Math.floor(plotW / 80))));
    for (i = n - 1; i >= 0; i -= every) {
      var tx = i * step + step / 2;
      var lab = tLabel(vis[i].t);
      if (tx - 16 > 0) ctx.fillText(lab, tx - 16, h - 6);
    }

    var p = lastPrice(c);

    // momento da entrada: linha vertical + ponto no preço
    if (L.e && L.et) {
      var ms = IV_MS[state.interval] || 6e4, ei = -1;
      for (i = 0; i < n; i++) if (L.et >= vis[i].t && L.et < vis[i].t + ms) { ei = i; break; }
      if (ei < 0 && off + n === len && L.et >= vis[n - 1].t) ei = n - 1;
      if (ei >= 0) {
        var ex = xAt(ei);
        if (ctx.setLineDash) ctx.setLineDash([2, 3]);
        ctx.strokeStyle = 'rgba(96,165,250,0.6)';
        ctx.beginPath(); ctx.moveTo(ex, padT); ctx.lineTo(ex, vBase); ctx.stroke();
        if (ctx.setLineDash) ctx.setLineDash([]);
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath(); ctx.arc(ex, y(L.e), 4, 0, Math.PI * 2); ctx.fill();
      }
    }

    // níveis: entrada, alvo, stop
    if (ctx.setLineDash) ctx.setLineDash([6, 4]);
    for (i = 0; i < lvList.length; i++) {
      var lvv = lvList[i], ly = Math.round(y(lvv.v)) + 0.5;
      ctx.strokeStyle = lvv.col; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(plotW, ly); ctx.stroke();
      var dist = (lvv.v - p) / p * 100;
      ctx.fillStyle = lvv.col;
      ctx.fillText(lvv.n + ' ' + (dist >= 0 ? '+' : '') + dist.toFixed(2) + '%', 6, ly - 4);
    }
    if (ctx.setLineDash) ctx.setLineDash([]);
    ctx.lineWidth = 1;
    for (i = 0; i < lvList.length; i++) {
      tag(ctx, plotW + 1, y(lvList[i].v), axisW - 1, fmtL(lvList[i].v), lvList[i].col, '#fff');
    }

    // preço atual
    var lk = c.candles[len - 1], lastUp = lk.c >= lk.o;
    var py = Math.round(y(p)) + 0.5;
    if (p > hi || p < lo) return;  // gráfico deslocado para o passado: preço atual fora da tela
    if (ctx.setLineDash) ctx.setLineDash([2, 3]);
    ctx.strokeStyle = '#8b95a5';
    ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(plotW, py); ctx.stroke();
    if (ctx.setLineDash) ctx.setLineDash([]);
    tag(ctx, plotW + 1, py, axisW - 1, fmt(p), lastUp ? '#26a69a' : '#ef5350', '#fff');
  }

  // ---------- som de alerta ----------
  function unlockAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      var b = audioCtx.createBuffer(1, 1, 22050), src = audioCtx.createBufferSource();
      src.buffer = b; src.connect(audioCtx.destination);
      if (src.start) src.start(0); else src.noteOn(0);
    } catch (e) {}
  }
  function beep(freq) {
    if (!state.sound || !audioCtx) return;
    try {
      var t0 = audioCtx.currentTime;
      for (var r = 0; r < 3; r++) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
        g.gain.value = 0.25;
        var st = t0 + r * 0.35;
        if (o.start) { o.start(st); o.stop(st + 0.2); } else { o.noteOn(st); o.noteOff(st + 0.2); }
      }
    } catch (e) {}
  }

  // ---------- seletor de moedas ----------
  function openPicker() {
    $('picker').style.display = 'block';
    $('search').value = '';
    setMode(state.mode);
    if (!tickers.length || Date.now() - tickTime > 60000) {
      if (!tickers.length) $('list').innerHTML = '<div id="listMsg">Carregando lista da Binance...</div>';
      loadTickers(function (ok) {
        if (ok) renderList();
        else if (!tickers.length) $('list').innerHTML = '<div id="listMsg">Não consegui falar com a Binance. Verifique a internet e tente de novo.</div>';
      });
    }
    renderList();
  }
  function closePicker() { $('picker').style.display = 'none'; rebuild(false); }

  function setMode(m) {
    state.mode = m;
    $('togTop').className = 'tog' + (m === 'top' ? ' on' : '');
    $('togAll').className = 'tog' + (m === 'all' ? ' on' : '');
    save();
    renderList();
  }

  function renderList() {
    $('count').textContent = state.selected.length + '/' + MAX_CHARTS + ' selecionadas';
    if (!tickers.length) return;
    var q = $('search').value.toUpperCase().replace(/\s/g, '');
    var src = state.mode === 'top' && !q ? tickers.slice(0, 100) : tickers;
    var html = [], shown = 0;
    for (var i = 0; i < src.length; i++) {
      var t = src[i];
      if (q && t.b.indexOf(q) !== 0 && t.s.indexOf(q) < 0) continue;
      var sel = state.selected.indexOf(t.s) >= 0;
      html.push('<div class="it' + (sel ? ' sel' : '') + '" data-s="' + t.s + '">' +
        '<span class="n">' + (i + 1) + '</span><span class="s">' + t.b + '</span>' +
        '<span class="p">' + fmt(t.p) + '</span>' +
        '<span class="c ' + (t.ch >= 0 ? 'up' : 'dn') + '">' + (t.ch >= 0 ? '+' : '') + t.ch.toFixed(2) + '%</span>' +
        '<span class="ck">' + (sel ? '✓' : '') + '</span></div>');
      if (++shown >= 400) break;
    }
    $('list').innerHTML = html.length ? html.join('') : '<div id="listMsg">Nada encontrado.</div>';
  }

  $('list').addEventListener('click', function (ev) {
    var el = ev.target;
    while (el && el !== this && !(el.getAttribute && el.getAttribute('data-s'))) el = el.parentNode;
    if (!el || el === this) return;
    var s = el.getAttribute('data-s'), i = state.selected.indexOf(s);
    if (i >= 0) state.selected.splice(i, 1);
    else if (state.selected.length < MAX_CHARTS) state.selected.push(s);
    else { alert('Máximo de ' + MAX_CHARTS + ' moedas. Desmarque uma antes.'); return; }
    save();
    renderList();
  });

  $('search').addEventListener('input', renderList);
  $('togTop').onclick = function () { setMode('top'); };
  $('togAll').onclick = function () { setMode('all'); };
  $('btnDone').onclick = closePicker;
  $('btnCoins').onclick = openPicker;

  $('selInt').onchange = function () { state.interval = this.value; save(); rebuild(true); radarRestart(); };
  function indLabel() {
    $('btnInd').textContent = 'Indic: ' + (state.ind ? 'on' : 'off');
    $('btnSig').textContent = 'Sinais: ' + (state.sig ? 'on' : 'off');
  }
  $('btnSig').onclick = function () {
    state.sig = !state.sig; save(); indLabel();
    for (var s in charts) if (charts.hasOwnProperty(s)) { updateHead(charts[s]); scheduleDraw(charts[s]); }
  };
  $('btnInd').onclick = function () {
    state.ind = !state.ind; save(); indLabel();
    for (var s in charts) if (charts.hasOwnProperty(s)) { updateHead(charts[s]); scheduleDraw(charts[s]); }
  };
  $('btnSound').onclick = function () {
    state.sound = !state.sound;
    if (state.sound) { unlockAudio(); beep(660); }
    this.textContent = 'Som: ' + (state.sound ? 'on' : 'off');
  };

  // tela girou ou mudou de tamanho
  var rT = null;
  function onResize() { clearTimeout(rT); rT = setTimeout(layout, 250); }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  // voltou de tela apagada: recarrega tudo
  // ao voltar, refaz a varredura (o Safari congela a página com a tela apagada)
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { rebuild(true); radarRestart(3000); } });
  window.addEventListener('pageshow', function (e) { if (e.persisted) rebuild(true); });

  // atualiza a variação 24h de vez em quando
  setInterval(function () {
    if (state.selected.length) loadTickers(function () { for (var s in charts) if (charts.hasOwnProperty(s)) updateHead(charts[s]); });
  }, 300000);

  // ======================= RADAR =======================
  // varre outras moedas em segundo plano, logo após o fechamento de cada candle
  function normSym(s) {
    s = String(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
    return !s ? '' : /USDT$/.test(s) ? s : s + 'USDT';
  }
  function radarBuildList() {
    var R = RULES.radar, out = [], i, s, count = 0;
    if (!R.so_fixas) {
      for (i = 0; i < tickers.length && count < R.top; i++) { out.push(tickers[i].s); count++; }
    }
    var fx = R.fixas || [];
    for (i = 0; i < fx.length; i++) { s = normSym(fx[i]); if (s && out.indexOf(s) < 0) out.push(s); }
    radar.list = out;
  }
  function radarEnsureList(cb) {
    var stale = Date.now() - radar.listT > RULES.radar.atualizar_lista_min * 6e4;
    if (!stale && tickers.length) { radarBuildList(); cb(); return; }
    loadTickers(function () { radar.listT = Date.now(); radarBuildList(); cb(); });
  }

  function radarRestart(delay) {
    radar.gen++;
    radar.scanning = false;
    clearTimeout(radar.timer);
    radarBtn();
    if (!state.radar) return;
    radar.timer = setTimeout(radarScan, delay == null ? 2000 : delay);
  }
  function radarSchedule() {
    clearTimeout(radar.timer);
    if (!state.radar) return;
    var ms = IV_MS[state.interval];
    radar.next = Math.floor(Date.now() / ms) * ms + ms + 4000;   // 4s depois do fechamento
    radar.timer = setTimeout(radarScan, Math.max(1000, radar.next - Date.now()));
  }

  function radarScan() {
    if (!state.radar) return;
    var gen = ++radar.gen, iv = state.interval;
    radar.scanning = true; radar.prog = 0; radarBtn();
    radarEnsureList(function () {
      if (gen !== radar.gen) return;
      var list = radar.list.filter(function (s) { return state.selected.indexOf(s) < 0; }), idx = 0;
      radar.total = list.length;
      function nextCoin() {
        if (gen !== radar.gen || !state.radar || iv !== state.interval) return;
        if (idx >= list.length) {
          radar.scanning = false; radar.lastScan = Date.now();
          radarBtn(); radarInfo(); radarSchedule();
          radarTrack();
          return;
        }
        var sym = list[idx++];
        radar.prog = idx; radarBtn();
        radarCheck(sym, iv, function () { setTimeout(nextCoin, 350); });
      }
      nextCoin();
    });
  }

  function radarCheck(sym, iv, done) {
    get('/api/v3/klines?symbol=' + sym + '&interval=' + iv + '&limit=' + LIMIT, function (d) {
      if (iv !== state.interval || !d || d.length < 70) { done(); return; }
      var o = { sym: sym, candles: d.map(parseK) };
      var hiv = RULES.tempo_maior[iv];
      function fin() {
        try {
          calcInd(o);   // calcula indicadores + sinais com as mesmas regras dos painéis
          var last = o.candles.length - 2, g = o.act;
          if (g && g.res === 'aberto' && last - g.i <= 1) radarAlert(sym, iv, g);
        } catch (e) {}
        done();
      }
      if (!hiv) { fin(); return; }
      var key = sym + '|' + hiv, hc = radar.htf[key], hms = IV_MS[hiv];
      // reaproveita o tempo maior enquanto não fecha um candle novo nele
      if (hc && hc[hc.length - 1].t === Math.floor(Date.now() / hms) * hms) { setHtf(o, hc, hiv); fin(); return; }
      get('/api/v3/klines?symbol=' + sym + '&interval=' + hiv + '&limit=200', function (hd) {
        var h = hd.map(parseK);
        radar.htf[key] = h;
        setHtf(o, h, hiv); fin();
      }, fin);
    }, done);
  }
  function setHtf(o, h, hiv) {
    var cl = h.map(function (k) { return k.c; });
    o.htf = h; o.htfIv = hiv; o.hE9 = ema(cl, 9); o.hE21 = ema(cl, 21);
    o.htfKey = h.length + ':' + h[h.length - 1].t;
  }

  // ---------- avisos ----------
  function radarLoad() {
    try {
      var a = JSON.parse(window.localStorage.getItem('mc_radar') || '[]');
      if (a && a.length) { radar.alerts = a; a.forEach(function (x) { radar.seen[x.id] = 1; }); }
    } catch (e) {}
  }
  function radarSave() {
    try { window.localStorage.setItem('mc_radar', JSON.stringify(radar.alerts.slice(0, 100))); } catch (e) {}
  }
  function radarAlert(sym, iv, g) {
    var id = sym + '|' + iv + '|' + g.t;
    if (radar.seen[id]) return;
    radar.seen[id] = 1;
    var a = { id: id, sym: sym, iv: iv, score: g.score, tipo: g.tipo, det: g.det, e: g.e, s: g.s, t1: g.t1, t2: g.t2, t: g.t, at: Date.now() };
    radar.alerts.unshift(a);
    if (radar.alerts.length > 100) radar.alerts.length = 100;
    radar.unseen++;
    radarSave(); radarBtn(); radarInfo();
    showToast(a);
    beep(1046);
  }
  function ago(a) { return durLabel(Date.now() - (a.t + IV_MS[a.iv])); }

  function showToast(a) {
    var box = $('toasts'), el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<div class="tt"><b>◆ ' + a.sym.replace(/USDT$/, '') + '</b> · COMPRA ' + a.score + '</div>' +
      '<div class="td">' + a.iv + ' · ' + a.tipo + ' · entrada ' + fmt(a.e) + '</div>' +
      '<button class="op">Abrir</button><button class="cl">✕</button>';
    el.querySelector('.op').onclick = function () { box.removeChild(el); radarOpen(a); };
    el.querySelector('.cl').onclick = function () { box.removeChild(el); };
    box.insertBefore(el, box.firstChild);
    while (box.children.length > 3) box.removeChild(box.lastChild);
  }

  function radarBtn() {
    var b = $('btnRadar');
    if (!state.radar) { b.textContent = 'Radar: off'; b.className = ''; return; }
    if (radar.scanning && radar.total) b.textContent = 'Radar ⟳ ' + radar.prog + '/' + radar.total;
    else b.textContent = 'Radar' + (radar.unseen ? ' (' + radar.unseen + ')' : '');
    b.className = radar.unseen ? 'hot' : '';
  }

  function radarInfo() {
    if ($('radarBox').style.display !== 'block') return;
    var R = RULES.radar, hm = function (t) { var d = new Date(t); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
    var info = state.radar
      ? 'Vigiando ' + radar.list.filter(function (s) { return state.selected.indexOf(s) < 0; }).length + ' moedas no ' + state.interval +
        (R.so_fixas ? ' (lista fixa)' : ' (top ' + R.top + (R.fixas && R.fixas.length ? ' + ' + R.fixas.length + ' fixas' : '') + ')') +
        (radar.scanning ? ' · varrendo ' + radar.prog + '/' + radar.total : radar.next ? ' · próxima varredura ' + hm(radar.next) : '') +
        (radar.listT ? ' · lista de ' + hm(radar.listT) : '')
      : 'Radar desligado.';
    $('rdInfo').textContent = info;
    $('rdTog').textContent = 'Radar: ' + (state.radar ? 'on' : 'off');
    $('rdTog').className = 'tog' + (state.radar ? ' on' : '');
    // filtro por tempo gráfico + ordem pela hora do sinal (mais novo primeiro)
    $('rdTf').textContent = radar.allTf ? 'Todos os tempos' : 'Só ' + state.interval;
    $('rdTf').className = 'tog' + (radar.allTf ? '' : ' on');
    var rows = radar.alerts.filter(function (a) { return radar.allTf || a.iv === state.interval; });
    rows.sort(function (x, y) { return (y.t + IV_MS[y.iv]) - (x.t + IV_MS[x.iv]); });

    // placar real do radar
    var sc = { n: 0, w: 0, l: 0, r: 0, ab: 0 };
    rows.forEach(function (a) {
      if (a.res === 'stop') { sc.n++; sc.l++; sc.r += a.r; }
      else if (a.res === 'alvo1' || a.res === 'alvo2') { sc.n++; sc.w++; sc.r += a.r; }
      else sc.ab++;
    });
    var scEl = $('rdScore');
    if (!rows.length) { scEl.textContent = ''; }
    else if (!sc.n) { scEl.style.color = '#8b95a5'; scEl.textContent = 'Placar: nenhum sinal encerrado ainda · ' + sc.ab + ' em andamento'; }
    else {
      scEl.style.color = sc.r >= 0 ? '#4ade80' : '#f87171';
      scEl.textContent = 'Placar' + (radar.allTf ? '' : ' (' + state.interval + ')') + ': ' + sc.n + ' encerrados · ✓' + sc.w + ' ✕' + sc.l +
        ' · ' + Math.round(sc.w / sc.n * 100) + '% · ' + (sc.r >= 0 ? '+' : '') + sc.r.toFixed(1) + 'R' +
        (sc.ab ? ' · ' + sc.ab + ' em andamento' : '') + ' (sem taxas)';
    }

    var html = [];
    for (var i = 0; i < rows.length; i++) {
      var a = rows[i], st;
      if (a.res === 'stop') st = '<span class="st loss">✕ Stop -1R</span>';
      else if (a.res === 'alvo2') st = '<span class="st win">✓✓ Alvo 2 +' + a.r.toFixed(2) + 'R</span>';
      else if (a.res === 'alvo1') st = '<span class="st win">✓ Alvo 1 +' + a.r.toFixed(2) + 'R</span>';
      else if (a.res === 'alvo1aberto') st = '<span class="st win">✓ Alvo 1 · segue</span>';
      else st = '<span class="st">em andamento</span>';
      html.push('<div class="ra" data-id="' + a.id + '"><b>' + a.sym.replace(/USDT$/, '') + '</b>' +
        '<span class="sc">' + a.score + '</span>' +
        '<span class="rd">' + a.iv + ' · ' + a.tipo + ' · ' + dtShort(a.t + IV_MS[a.iv]) + ' (há ' + ago(a) + ')' +
        '<br>E ' + fmt(a.e) + ' · S ' + fmt(a.s) + ' · A1 ' + fmt(a.t1) + ' · A2 ' + fmt(a.t2) + '</span>' +
        '<button>Abrir</button>' + st + '</div>');
    }
    $('rdList').innerHTML = html.length ? html.join('') :
      '<div id="listMsg">' + (radar.alerts.length ? 'Nenhum sinal no ' + state.interval + '. Toque em "Só ' + state.interval + '" para ver todos.' : 'Nenhum sinal ainda. Os avisos aparecem aqui e no canto da tela.') + '</div>';
  }

  // acompanha o que aconteceu com cada sinal (mesma regra do teste: metade no alvo 1, stop vai para a entrada)
  function radarTrack(done) {
    if (radar.tracking) { if (done) done(); return; }
    var pend = radar.alerts.filter(function (a) { return !a.res || a.res === 'aberto' || a.res === 'alvo1aberto'; });
    if (!pend.length) { if (done) done(); return; }
    radar.tracking = true; radar.trackT = Date.now();
    var idx = 0;
    function next() {
      if (idx >= pend.length) { radar.tracking = false; radarSave(); radarInfo(); if (done) done(); return; }
      var a = pend[idx++];
      get('/api/v3/klines?symbol=' + a.sym + '&interval=' + a.iv + '&startTime=' + a.t + '&limit=1000', function (d) {
        var cs = d.map(parseK);
        if (cs.length && cs[0].t === a.t) {
          var s = { i: 0, e: a.e, s: a.s, t1: a.t1, t2: a.t2 };
          resolveSig(s, cs, cs.length - 2);   // só candles fechados
          a.res = s.res; a.r = s.r;
        }
        setTimeout(next, 350);
      }, function () { setTimeout(next, 350); });
    }
    next();
  }

  // abre a moeda: painel livre, ou substitui o último sem operação marcada; depois amplia
  function radarOpen(a) {
    var ivChanged = a.iv !== state.interval;
    if (ivChanged) { state.interval = a.iv; $('selInt').value = a.iv; }
    if (state.selected.indexOf(a.sym) < 0) {
      if (state.selected.length < MAX_CHARTS) state.selected.push(a.sym);
      else {
        var pos = -1, i;
        for (i = state.selected.length - 1; i >= 0; i--) {
          var L = state.levels[state.selected[i]];
          if (!L || !L.e) { pos = i; break; }
        }
        if (pos < 0) {
          pos = state.selected.length - 1;
          if (!confirm('Todos os painéis têm operação marcada.\nSubstituir ' + state.selected[pos].replace(/USDT$/, '') + ' por ' + a.sym.replace(/USDT$/, '') + '?\n(os níveis dela ficam guardados)')) return;
        }
        state.selected[pos] = a.sym;
      }
    }
    expanded = a.sym;
    save();
    rebuild(ivChanged);
    if (ivChanged) radarRestart();
  }

  function openRadar() {
    radar.unseen = 0; radarBtn();
    $('radarBox').style.display = 'block';
    radarInfo();
    if (Date.now() - (radar.trackT || 0) > 60000) radarTrack();
  }

  // ---------- início ----------
  setInterval(loadH1, 60000);
  // tempo maior: atualiza a cada 3 minutos
  setInterval(function () { for (var s in charts) if (charts.hasOwnProperty(s)) loadHTF(charts[s]); }, 180000);
  // atualiza o tempo de operação mesmo sem tick novo
  setInterval(function () { for (var s in charts) if (charts.hasOwnProperty(s)) updateHead(charts[s]); }, 30000);

  load();
  applyLink();
  syncUrl();
  loadRules();
  radarLoad();

  $('btnRadar').onclick = openRadar;
  $('rdClose').onclick = function () { $('radarBox').style.display = 'none'; };
  $('rdTog').onclick = function () {
    state.radar = !state.radar; save();
    radarRestart(500); radarInfo();
  };
  $('rdClear').onclick = function () {
    if (!radar.alerts.length || !confirm('Apagar a lista de avisos?')) return;
    radar.alerts = []; radarSave(); radarInfo();
  };
  $('rdTf').onclick = function () { radar.allTf = !radar.allTf; radarInfo(); };
  $('rdList').addEventListener('click', function (ev) {
    if (ev.target.tagName !== 'BUTTON') return;
    var id = ev.target.parentNode.getAttribute('data-id'), a = null;
    for (var q = 0; q < radar.alerts.length; q++) if (radar.alerts[q].id === id) a = radar.alerts[q];
    if (!a) return;
    $('radarBox').style.display = 'none';
    radarOpen(a);
  });
  // a lista mostra "há X min": atualiza enquanto aberta
  setInterval(radarInfo, 30000);
  radarBtn();
  radarRestart(4000);
  indLabel();
  $('btnLink').onclick = function () {
    if (!state.selected.length) { alert('Escolha pelo menos uma moeda primeiro.'); return; }
    var url = linkUrl();
    if (copyText(url)) alert('Link copiado:\n\n' + url + '\n\nSalve nos favoritos ou abra em outro aparelho.');
    else prompt('Copie o link abaixo:', url);
  };
  $('selInt').value = state.interval;
  loadTickers(function () { for (var s in charts) if (charts.hasOwnProperty(s)) updateHead(charts[s]); });
  rebuild(false);
})();
</script>
